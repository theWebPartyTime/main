entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls: {}

  server-backend:
    address: ":8080"
        
  dashboard:
    address: ":8081"



certificatesResolvers:
  le: 
    acme:
      email: "den.spesivtsev.006@gmail.com"
      storage: "/letsencrypt/acme.json"
      httpChallenge:
        entryPoint: web



providers:
  file:
    filename: /etc/traefik/routes.yml

api:
  insecure: false
  dashboard: true

log:
  level: "DEBUG"
